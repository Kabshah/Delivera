name: Build Delivra APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

# GITHUB_TOKEN needs contents:write to publish Releases (default is read-only)
permissions:
  contents: write

# NOTE: this file MUST live at the REPO ROOT .github/workflows/ —
# GitHub Actions ignores .github folders inside subdirectories.

defaults:
  run:
    working-directory: delivra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (required for the libnode native build)
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Set up Node.js (for building Baileys assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        working-directory: delivra/app/src/main/assets/nodejs-project
        run: npm install --production

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APKs (per-ABI splits)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APKs (per-ABI splits, unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: delivra-debug
          path: |
            delivra/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            delivra/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: delivra-release-unsigned
          path: |
            delivra/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            delivra/app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      # On tag push: attach APKs to a GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            delivra/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            delivra/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          body: |
            ## Delivra ${{ github.ref_name }}

            **Two APK variants — pick the one matching your CPU (unsigned, so enable "Install from unknown sources" or use adb):**

            | File | For devices |
            |---|---|
            | `app-arm64-v8a-release.apk` | **Almost every phone from ~2017 onwards** (Snapdragon, Exynos, Dimensity, Unisoc T6xx+…) — start here |
            | `app-armeabi-v7a-release.apk` | Older / entry-level 32-bit-only phones — use only if the arm64 APK refuses to install |

            ### Installation
            ```bash
            adb install app-arm64-v8a-release.apk
            ```
            Or transfer to your phone and open with a file manager.

            ### Permissions requested
            - `RECEIVE_BOOT_COMPLETED` — reschedules alarms after device reboot (nothing more)
            - `SCHEDULE_EXACT_ALARM` — required for exact-time message delivery
            - `FOREGROUND_SERVICE` — runs briefly around each scheduled send
            - `POST_NOTIFICATIONS` — failure/review alerts
            - `INTERNET` — WhatsApp Web multi-device protocol (Baileys)

            See [README](delivra/README.md) for full setup and known reliability caveats.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
