name: Build Delivra APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release from this run'
        required: false
        type: boolean
        default: false

# GITHUB_TOKEN needs contents:write to publish Releases (default is read-only)
permissions:
  contents: write

# NOTE: this file MUST live at the REPO ROOT .github/workflows/ —
# GitHub Actions ignores .github folders inside subdirectories.

defaults:
  run:
    working-directory: delivra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake (required for the libnode native build)
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Set up Node.js (for building Baileys assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        working-directory: delivra/app/src/main/assets/nodejs-project
        run: npm install --production

      - name: Verify and apply Baileys runtime patches
        working-directory: delivra
        run: node tools/minify-engine.mjs --patch-only

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APKs (per-ABI splits)
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APKs (per-ABI splits, signed with the committed release key)
        run: ./gradlew assembleRelease --no-daemon

      # Release APKs are SIGNED by app/build.gradle.kts (committed keystore) —
      # Gradle emits plain *-release.apk names. Debug APKs keep their names.
      - name: Stage APKs with friendly names
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk        "${{ github.workspace }}/dist/Delivra-arm64-v8a-debug.apk"
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk      "${{ github.workspace }}/dist/Delivra-armeabi-v7a-debug.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk    "${{ github.workspace }}/dist/Delivra-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk  "${{ github.workspace }}/dist/Delivra-armeabi-v7a.apk"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: delivra-debug
          path: |
            dist/*arm64-v8a-debug.apk
            dist/*armeabi-v7a-debug.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: delivra-release
          path: |
            dist/*arm64-v8a.apk
            dist/*armeabi-v7a.apk

      # On tag push (or workflow_dispatch with create_release): attach APKs to a GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: Delivra ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Delivra-arm64-v8a.apk
            dist/Delivra-armeabi-v7a.apk
          body: |
            ## Delivra ${{ github.ref_name }}

            **Two APK variants — pick the one matching your CPU:**

            | File | For devices |
            |---|---|
            | `Delivra-arm64-v8a.apk` | **Almost every phone from ~2017 onwards** (Snapdragon, Exynos, Dimensity, Unisoc T6xx+…) — start here |
            | `Delivra-armeabi-v7a.apk` | Older / entry-level 32-bit-only phones — use only if the arm64 APK refuses to install |

            ### What's new in ${{ github.ref_name }}
            - **Voice Notes — Complete Pipeline Fix**: recordings of any length now save and schedule (a units bug used to cut every take at 0.3 s), and delivered voice notes now PLAY on WhatsApp — the recorder no longer lets Samsung's encoder leak a proprietary header blob ("SAOPUSHDR") or empty packets into the Ogg file, granule positions follow each packet's real duration, and WhatsApp-ready seconds + waveform are attached automatically.
            - **Dispatch Self-Healing**: if the WhatsApp socket dies mid-session, the next dispatch reconnects on its own instead of stranding messages in "Sending" until an app restart.
            - **Media Send Fix (carried from v1.6.1)**: one failed `media_conn` query can no longer poison every later media send; protocol version falls back to the bundled Baileys version.
            - **Verified engine patches**: all runtime patches are verified at build time — a broken patch fails the build instead of shipping failed media sends.
            - **Multi-day Stability (Day 1 - Day 100)**: all session and socket cleanup safeguards preserved — no memory bloat or Day 2/25 re-launch crashes.
            - **Assets Version 18**: unchanged — no engine re-extraction needed on update.

            ### Installation
            ```bash
            adb install Delivra-arm64-v8a.apk
            ```
            Or transfer to your phone and open with a file manager.

            ### Permissions requested
            - `RECEIVE_BOOT_COMPLETED` — reschedules alarms after device reboot (nothing more)
            - `SCHEDULE_EXACT_ALARM` — required for exact-time message delivery
            - `FOREGROUND_SERVICE` — runs briefly around each scheduled send
            - `POST_NOTIFICATIONS` — failure/review alerts
            - `INTERNET` — WhatsApp Web multi-device protocol (Baileys)

            See [README](README.md) for full setup and known reliability caveats.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

