name: Build Delivra APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (required for the libnode native build)
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Set up Node.js (for building Baileys assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        working-directory: app/src/main/assets/nodejs-project
        run: npm install --production

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: delivra-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: delivra-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      # On tag push: attach APK to GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Delivra ${{ github.ref_name }}

            **This is an unsigned APK — install via ADB or allow "Install from unknown sources" on your Android device.**

            ### Installation
            ```bash
            adb install app-release-unsigned.apk
            ```
            Or transfer to your phone and open with a file manager.

            ### Permissions requested
            - `RECEIVE_BOOT_COMPLETED` — reschedules alarms after device reboot (nothing more)
            - `SCHEDULE_EXACT_ALARM` — required for exact-time message delivery
            - `FOREGROUND_SERVICE` — runs briefly around each scheduled send
            - `POST_NOTIFICATIONS` — failure/review alerts
            - `INTERNET` — WhatsApp Web multi-device protocol (Baileys)
            - `REQUEST_IGNORE_BATTERY_OPTIMIZATIONS` — prompted once during onboarding to improve delivery reliability

            See [README](README.md) for full setup and known reliability caveats.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
